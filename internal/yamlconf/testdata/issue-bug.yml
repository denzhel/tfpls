name: Bug
description: Something is broken
title: "bug: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the workflow, workspace and run URL. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: textarea
    id: tests
    attributes:
      label: Test plan for the fix
      value: |
        - [ ] Regression test:
        - [ ] Sandbox (GitHub) check:
