<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">tfpls: TF, please.</title>
  <desc id="d">An unimpressed, half-lidded tofu cube holds a sign that says please. Three sarcastic speech bubbles say: read the plan, wait your turn, ship. fine. Next to it: the name tfpls and the line "TF, please."</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EA"/>
      <stop offset="1" stop-color="#FFE8D0"/>
    </linearGradient>
    <linearGradient id="tofu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFA"/>
      <stop offset="1" stop-color="#F4E8C8"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .hand{font-family:"Segoe Print","Chalkboard SE","Comic Sans MS",ui-rounded,"Trebuchet MS",sans-serif}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .bob{animation:bob 2.6s ease-in-out infinite}
    .float{animation:float 3.2s ease-in-out infinite}
    .twinkle{animation:twinkle 2.4s ease-in-out infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.eye,.bob,.float,.twinkle{animation:none}}
  </style>

  <!-- card -->
  <rect x="2" y="2" width="896" height="296" rx="28" fill="url(#card)" stroke="#F1CFA8" stroke-width="3"/>

  <!-- speech bubbles: plan, lock, ship (said with feeling) -->
  <g class="hand" font-size="18" font-weight="700" text-anchor="middle" fill="#3B3347">
    <g class="float">
      <rect x="36" y="16" width="132" height="40" rx="20" fill="#CFE6FF" stroke="#9CC7F2" stroke-width="2.5"/>
      <path d="M94 55 L102 68 L112 55 Z" fill="#CFE6FF" stroke="#9CC7F2" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="92" y="54" width="22" height="4" fill="#CFE6FF"/>
      <text x="102" y="44">read the plan</text>
    </g>
    <g class="float" style="animation-delay:0.5s">
      <rect x="184" y="10" width="132" height="40" rx="20" fill="#FFE6A8" stroke="#F0C766" stroke-width="2.5"/>
      <path d="M242 49 L250 62 L260 49 Z" fill="#FFE6A8" stroke="#F0C766" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="240" y="48" width="22" height="4" fill="#FFE6A8"/>
      <text x="250" y="38">wait your turn</text>
    </g>
    <g class="float" style="animation-delay:1s">
      <rect x="332" y="16" width="100" height="40" rx="20" fill="#CDF1D6" stroke="#8FD3A3" stroke-width="2.5"/>
      <path d="M374 55 L382 68 L392 55 Z" fill="#CDF1D6" stroke="#8FD3A3" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="372" y="54" width="22" height="4" fill="#CDF1D6"/>
      <text x="382" y="44">ship. fine.</text>
    </g>
  </g>

  <!-- the polite tofu -->
  <g transform="translate(72,92)">
    <ellipse cx="102" cy="164" rx="96" ry="12" fill="#6B4E2E" opacity=".12"/>
    <!-- body -->
    <rect x="14" y="14" width="176" height="146" rx="26" fill="url(#tofu)" stroke="#E4D0A2" stroke-width="3.5"/>
    <path d="M34 34 Q60 22 96 24" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <!-- face -->
    <ellipse class="eye" cx="72" cy="82" rx="9" ry="12" fill="#2B2736"/>
    <ellipse class="eye" cx="132" cy="82" rx="9" ry="12" fill="#2B2736"/>
    <circle cx="76" cy="80" r="3" fill="#FFFFFF"/>
    <circle cx="136" cy="80" r="3" fill="#FFFFFF"/>
    <ellipse cx="54" cy="104" rx="15" ry="8" fill="#FF8FA3" opacity=".5"/>
    <ellipse cx="150" cy="104" rx="15" ry="8" fill="#FF8FA3" opacity=".5"/>
    <path d="M86 110 Q104 112 120 100" fill="none" stroke="#2B2736" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M60 78 L84 78 L84 66 Q72 62 60 66 Z" fill="#FBF5DD"/>
    <path d="M118 78 L144 78 L144 66 Q132 62 118 66 Z" fill="#FBF5DD"/>
    <path d="M60 78 L84 78" stroke="#2B2736" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M120 78 L144 78" stroke="#2B2736" stroke-width="4.5" stroke-linecap="round"/>
    <!-- arm and sign -->
    <path d="M186 118 Q206 118 222 100" fill="none" stroke="#E4D0A2" stroke-width="14" stroke-linecap="round"/>
    <path d="M186 118 Q206 118 222 100" fill="none" stroke="#F8EFD8" stroke-width="9" stroke-linecap="round"/>
    <g class="bob">
      <rect x="219" y="22" width="7" height="104" rx="3.5" fill="#B88B5B"/>
      <rect x="172" y="-20" width="104" height="46" rx="12" fill="#FFFFFF" stroke="#E0C9A6" stroke-width="3.5"/>
      <text class="hand" x="224" y="12" text-anchor="middle" font-size="25" font-weight="700" fill="#7A4B2A">please.</text>
      <circle cx="222" cy="100" r="10" fill="#F8EFD8" stroke="#E4D0A2" stroke-width="3"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#F4B942">
    <path class="twinkle" d="M392 122 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path class="twinkle" style="animation-delay:.8s" d="M52 98 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path class="twinkle" style="animation-delay:1.4s" d="M400 222 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  </g>

  <!-- name -->
  <text class="mono" x="446" y="168" font-size="104" font-weight="800" fill="#2B2736" letter-spacing="-2">tfpls</text>
  <text class="hand" x="450" y="214" font-size="34" font-style="italic" fill="#B0682F">TF, please.</text>
  <text class="hand" x="450" y="252" font-size="19" fill="#6F5D4B">Hope is not a deployment strategy.</text>
</svg>
