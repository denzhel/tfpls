# Publishes the tfpls binary when a release tag is pushed (tools/release.sh pushes vX.Y.Z and vX.Y.Z-rc.N).
# Builds four binaries (tools/build-release.sh), signs their provenance (GitHub build attestation) and creates or updates the
# GitHub Release with tfpls_<os>_<arch>.tar.gz and SHA256SUMS. How to verify: docs/releasing.md. No secrets: GITHUB_TOKEN only.
name: release
on:
  push:
    # exact version tags only: the moving major tag (v0) must not start a (failing) release run
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release and upload the assets
      id-token: write       # sign the provenance (OIDC to Sigstore)
      attestations: write   # store the provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build the assets
        run: bash tools/build-release.sh "$TAG" dist
      - name: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tfpls_*.tar.gz
            dist/SHA256SUMS
      - name: create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); case "$TAG" in *-*) pre=(--prerelease);; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tfpls_*.tar.gz dist/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md "${pre[@]}"
          else
            gh release create "$TAG" dist/tfpls_*.tar.gz dist/SHA256SUMS --title "$TAG" --notes-file dist/RELEASE_NOTES.md --verify-tag "${pre[@]}"
          fi
