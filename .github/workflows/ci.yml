# CI for the tfpls repo itself, on GitHub-hosted runners.
# Needs actionlint (installed below, pinned and checksum-verified), shellcheck, yq, jq and python3 (on the runner image).
# Lints the workflows and scripts, runs the offline test suite.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install actionlint (pinned, checksum verified)
        run: |
          v=1.7.12; sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sum  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint && sudo install /tmp/actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: |
          actionlint -color
      - name: shellcheck
        run: shellcheck -S warning actions/*/*.sh tools/* tests/*.sh
      - name: yaml parses
        run: |
          for f in .github/workflows/*.yml actions/*/action.yml examples/.tfpls.yml .github/ISSUE_TEMPLATE/*.yml; do
            yq '.' "$f" > /dev/null || { echo "::error file=$f::not valid YAML"; exit 1; }
          done

  bin-action:
    # the action that puts tfpls on the PATH of a job: on a branch it builds the binary from this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/bin
      - name: the binary is on the PATH and runs
        env:
          NEEDS: '{"detect":{"result":"success"},"plan":{"result":"skipped"}}'
        run: |
          [ "$(tfpls version)" = dev ]
          tfpls result

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "::error::gofmt needed for:"; echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: install govulncheck (pinned)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: govulncheck the module
        run: govulncheck ./...
      - name: govulncheck fails on a known-vulnerable module (negative case)
        run: |
          d=$(mktemp -d)
          printf 'module neg\n\ngo 1.24\n\nrequire golang.org/x/text v0.3.0\n' > "$d/go.mod"
          printf 'package main\n\nimport "golang.org/x/text/language"\n\nfunc main() { _, _, _ = language.ParseAcceptLanguage("en") }\n' > "$d/main.go"
          cd "$d"
          GOFLAGS=-mod=mod go mod tidy
          if GOFLAGS=-mod=mod govulncheck ./...; then
            echo "::error::govulncheck passed on golang.org/x/text v0.3.0 (GO-2021-0113); the gate is broken"
            exit 1
          fi
          echo "govulncheck rejected the vulnerable module, as it must"
      - name: cross-build (the release targets)
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              echo "build $os/$arch"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/tfpls || exit 1
            done
          done

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # real downloads on the hosted Linux runner: the install path used by the shared workflows (the policy tests need conftest)
      - name: install OpenTofu and conftest with the setup action
        uses: ./actions/setup
      - name: installed versions match the defaults
        run: |
          tofu version | head -1
          conftest --version | head -1
          tofu version | head -1 | grep -q "v1.13.1"
          conftest --version | head -1 | grep -q "0.71.1"
      - name: offline tests
        run: bash tests/run-all.sh
