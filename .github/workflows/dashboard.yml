# Reusable: build the status dashboard from the data branch.
# Always: uploaded as the `tfpls-dashboard` artifact (download, open index.html) and shown in the run summary.
# Optional: pages: true deploys it to GitHub Pages; commit_page: true also stores it at dashboard/index.html on the data branch.
# Caller needs: on: schedule/workflow_dispatch/workflow_run; permissions: contents: read (write with commit_page);
#   pages: write and id-token: write with pages: true.
name: tfpls dashboard
on:
  workflow_call:
    inputs:
      runs_on: { type: string, default: ubuntu-latest, description: 'runner label, or a JSON array of labels' }
      pages: { type: boolean, default: false, description: "deploy to GitHub Pages (private repositories need a paid GitHub plan)" }
      commit_page: { type: boolean, default: false, description: "store the page at dashboard/index.html on the data branch" }

jobs:
  build:
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - id: d
        uses: denzhel/tfpls/actions/dashboard@v0.9.1
      - name: Run summary
        shell: bash
        run: cat "${{ steps.d.outputs.path }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfpls-dashboard
          path: ${{ steps.d.outputs.path }}
          retention-days: 14
          overwrite: true
      - uses: denzhel/tfpls/actions/bin@v0.9.1
      - name: Store the page on the data branch
        if: inputs.commit_page
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          BRANCH: tfpls-data
          SRC: ${{ steps.d.outputs.path }}
        run: tfpls glue store-page
      - if: inputs.pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.d.outputs.path }}

  deploy:
    needs: build
    if: inputs.pages
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 10
    # no permissions block here: a reusable workflow cannot ask for more than its caller grants, even in a skipped job,
    # so callers using `pages: true` grant pages: write and id-token: write themselves
    environment:
      name: github-pages
      url: ${{ steps.p.outputs.page_url }}
    steps:
      - id: p
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
