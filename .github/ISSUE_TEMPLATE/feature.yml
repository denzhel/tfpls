name: Feature
description: A new capability
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Outcome
      description: What will become possible when this item is complete, and why?
    validations: { required: true }
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] 
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that mean this is done.
      value: |
        - [ ] 
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: Test criteria
      description: The automated tests that prove each acceptance criterion, sandbox-on-GitHub checks, and negative cases (or why none applies).
      value: |
        - [ ] Local: 
        - [ ] Sandbox (GitHub): 
        - [ ] Negative case: 
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Prerequisite issues (also add native dependency links) or a missing decision. Write "None" if none.
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context and out of scope
