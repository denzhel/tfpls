name: result of the plan jobs
description: One stable check for branch protection. Add it as a job in YOUR caller workflow (opt-in), so the run page only gets an extra row if you want it.
inputs:
  needs:
    description: 'The needs context of the job that lists the plan job in needs, as JSON (toJSON of needs)'
    required: true
runs:
  using: composite
  steps:
    - uses: denzhel/tfpls/actions/bin@v0.9.0
    - shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
      run: tfpls result
