name: result of the plan jobs
description: One stable check for branch protection. Add it as a job in YOUR caller workflow (opt-in), so the run page only gets an extra row if you want it.
inputs:
  needs:
    description: 'Pass ${{ toJSON(needs) }} from the job that lists the plan job in needs'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
      run: ${{ github.action_path }}/result.sh
