name: notify slack
description: Post a short status message to a Slack, Microsoft Teams or generic webhook (no-op if the webhook is empty)
inputs:
  webhook:
    description: Slack incoming webhook URL
    default: ""
  status:
    required: true
  name:
    required: true
  kind:
    description: "plan | apply | drift"
    default: apply
  summary:
    default: ""
  format:
    description: "slack | teams | generic (plain JSON for your own receiver)"
    default: slack
  mention:
    description: "text added in front of failure messages, e.g. <!subteam^S0123> for a Slack user group"
    default: ""
  pr:
    description: "pull request number when the run was started from a pull request comment"
    default: ""
  counts:
    description: 'JSON {"add","change","destroy","replace"} of the plan'
    default: ""
  changes:
    description: 'JSON array [{"action","address"}] of the changed resources (output of the tofu action)'
    default: "[]"
  changes_more:
    description: "how many more changed resources there were beyond the listed ones"
    default: "0"
  template:
    description: "path of a jq file in the repository that builds the webhook body from the run JSON (notify_template)"
    default: ""
  template_ref:
    description: "read the template from this ref of the repository instead of the checkout (use the default branch for pull request runs)"
    default: ""
  github_token:
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: denzhel/tfpls/actions/bin@v0.8.0-rc.1
      if: inputs.webhook != ''
    - shell: bash
      if: inputs.webhook != ''
      env:
        HOOK: ${{ inputs.webhook }}
        FORMAT: ${{ inputs.format }}
        MENTION: ${{ inputs.mention }}
        STATUS: ${{ inputs.status }}
        NAME: ${{ inputs.name }}
        KIND: ${{ inputs.kind }}
        SUMMARY: ${{ inputs.summary }}
        URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        COUNTS: ${{ inputs.counts }}
        CHANGES: ${{ inputs.changes }}
        CHANGES_MORE: ${{ inputs.changes_more }}
        TEMPLATE: ${{ inputs.template }}
        TEMPLATE_REF: ${{ inputs.template_ref }}
        GH_TOKEN: ${{ inputs.github_token }}
        WORKSPACE_DIR: ${{ github.workspace }}
        SHA: ${{ github.sha }}
        # who and what: a push has the head commit; /tofu apply has the commenter and the pull request; otherwise the actor
        AUTHOR: ${{ github.event.head_commit.author.username || github.event.comment.user.login || github.actor }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.issue.title || '' }}
        COMMIT_URL: ${{ github.event.head_commit.url || github.event.issue.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
      run: tfpls notify-slack
