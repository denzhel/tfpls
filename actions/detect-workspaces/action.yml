name: detect workspaces
description: "Build a job matrix from .tfpls.yml (stacks x workspaces; all, changed, or selected by name/glob). Without a file: one stack, one workspace per workspaces/<name>/ folder"
inputs:
  config:
    description: Path to config file
    default: .tfpls.yml
  mode:
    description: "changed | all"
    default: changed
  base_ref:
    description: Git ref/sha to diff against (mode=changed)
    default: ""
  head_ref:
    description: "Git ref/sha whose changes since the merge base with base_ref select workspaces (mode=changed). Default HEAD. A pull request run passes the pull request's own head, so a base branch that moved on after the pull request was opened does not select workspaces the pull request did not touch."
    default: ""
  name:
    description: "Space-separated selectors (name, workspace, glob, or 'all'); overrides mode"
    default: ""
outputs:
  matrix:
    description: '{"include":[{"label":"dev-us-east-1"}, ...]} - one key, so jobs need no custom name'
    value: ${{ steps.detect.outputs.matrix }}
  entries:
    description: 'object keyed by label: {name,label,stack,dir,workspace,auto_apply,drift_remediate,policy_params,notify_secret,notify_format,notify_mention,notify_template,owner_paths,after,policy_dir,policy_packs,var_file,parallelism,require_reviewed_plan,plan_lock,lock_timeout,drift_fix}'
    value: ${{ steps.detect.outputs.entries }}
  names:
    description: 'JSON array of the selected workspace names (small, for steps that only need the names)'
    value: ${{ steps.detect.outputs.names }}
  any:
    description: "true if matrix is non-empty"
    value: ${{ steps.detect.outputs.any }}
  configured:
    description: "how many workspaces the config (or the default layout) describes, changed or not (0 = nothing was found)"
    value: ${{ steps.detect.outputs.configured }}
runs:
  using: composite
  steps:
    - uses: denzhel/tfpls/actions/bin@v0.9.1
    - id: detect
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        MODE: ${{ inputs.mode }}
        BASE: ${{ inputs.base_ref }}
        HEAD_REF: ${{ inputs.head_ref }}
        NAME: ${{ inputs.name }}
      run: tfpls detect
